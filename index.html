<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#f9fafb">
    <!-- CSP：unsafe-inline 允许 ES Module 内联 DOM 操作；cdn.jsdelivr.net 加载 Chart.js；本地字体无需外部字体域 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.googleapis.com fonts.gstatic.com; img-src 'self' https://flagcdn.com data:; connect-src https://site.api.espn.com;">
    <title>2026年美加墨世界杯 - 赛程展示</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=243">
    <script>window.jsVersion=81;</script>
    <!-- Chart.js: 赔率趋势折线图依赖，async 延迟加载不阻塞首屏渲染 -->
    <script async src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" crossorigin="anonymous" integrity="sha384-vsrfeLOOY6KuIYKDlmVH5UiBmgIdB1oEf7p01YgWHuqmOHfZr374+odEv96n9tNC"></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header__content">
                <div class="header__logo">
                    <h1><span class="header__trophy"></span> FIFA 2026</h1>
                </div>
                <nav class="nav" id="mainNav" aria-label="主导航">
                    <ul class="nav__list">
                        <li><a href="#schedule" class="nav__link nav__link--active" data-view="schedule">赛程</a></li>
                        <li><a href="#standings" class="nav__link" data-view="standings">积分榜</a></li>
                        <li><a href="#knockout" class="nav__link" data-view="knockout">晋级之路</a></li>
                        <li><a href="#predictions" class="nav__link" data-view="predictions">预测分析</a></li>
                        <li><a href="#analysis" class="nav__link" data-view="analysis">赔率趋势</a></li>
                    </ul>
                </nav>
                <div class="header__clock" id="headerClock">
                    <span class="header__clock-date" id="clockDate"></span>
                    <span class="header__clock-time" id="clockTime"></span>
                </div>
                <button class="header__mobile-btn" id="mobileMenuBtn" aria-label="菜单" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <main class="main">
        <!-- 赛程视图：比赛列表 -->
        <section class="schedule-section" id="schedule">
            <div class="container">
                <div class="schedule__header">
                    <h2>赛事日程</h2>
                    <div class="schedule__header-right">
                        <div class="schedule__stats">
                            <span id="matchCount">共 0 场比赛</span>
                        </div>
                        <button class="btn-refresh btn-refresh--page" id="btnRefreshSchedule" aria-label="刷新赛程数据" title="手动刷新赛程数据 / 显示自动刷新倒计时">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.65 2.35A8 8 0 1 0 16 8h-2a6 6 0 1 1-1.76-4.24L10 0h6v6l-2.35-3.65z" fill="currentColor"/></svg>
                            <span class="btn-refresh__label">刷新赛程</span>
                            <span class="btn-refresh__countdown" id="scheduleRefreshCountdown">180s</span>
                        </button>
                    </div>
                </div>
                <div id="scheduleContainer" class="schedule__container" aria-live="polite" aria-label="赛程列表">
                </div>
            </div>
        </section>

        <!-- 积分榜视图：12组小组排名 -->
        <section class="standings-section hidden" id="standings">
            <div class="container">
                <div class="schedule__header">
                    <h2>小组积分榜</h2>
                    <div class="schedule__header-right">
                        <button class="btn-refresh btn-refresh--page" id="btnRefreshStandings" aria-label="刷新积分榜数据" title="手动刷新积分榜数据">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.65 2.35A8 8 0 1 0 16 8h-2a6 6 0 1 1-1.76-4.24L10 0h6v6l-2.35-3.65z" fill="currentColor"/></svg>
                            <span class="btn-refresh__label">刷新积分</span>
                        </button>
                    </div>
                </div>
                <div id="standingsContainer" class="standings__container" aria-live="polite" aria-label="积分榜">
                </div>
            </div>
        </section>



        <!-- 赔率分析视图：趋势图 + 关键指标 -->
        <section class="analysis-section hidden" id="analysis">
            <div class="container">
                <div class="analysis-hero">
                    <div class="pred-hero__left">
                        <div class="pred-hero__eyebrow">
                            <span aria-hidden="true">📈</span>
                            赔率趋势
                        </div>
                        <h2 class="analysis-hero__title">赔率趋势分析</h2>
                        <p class="analysis-hero__desc">追踪开盘到即时的赔率变化，洞察市场情绪与资金流向</p>
                    </div>
                    <div class="analysis-hero__refresh">
                        <button class="btn-refresh btn-refresh--small" id="btnRefreshAnalysis" aria-label="刷新赔率趋势" title="手动刷新赔率趋势">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.65 2.35A8 8 0 1 0 16 8h-2a6 6 0 1 1-1.76-4.24L10 0h6v6l-2.35-3.65z" fill="currentColor"/></svg>
                            <span class="btn-refresh__label">刷新趋势</span>
                        </button>
                    </div>
                </div>

                <div class="analysis__toolbar">
                    <div class="analysis__filters">
                        <div class="analysis__filter-group">
                            <label for="oddsMatchSelect">选择比赛</label>
                            <select id="oddsMatchSelect">
                                <option value="">-- 请选择比赛 --</option>
                            </select>
                        </div>
                        <div class="analysis__filter-group">
                            <label for="filterOddsType">盘口类型</label>
                            <select id="filterOddsType">
                                <option value="moneyline" selected>独赢</option>
                                <option value="spread">让球</option>
                                <option value="total">大小球</option>
                            </select>
                        </div>
                    </div>
                    <div class="analysis__toolbar-right">
                        <div class="provider-tabs" id="providerTabs" role="tablist" aria-label="赔率提供商">
                            <button class="provider-tabs__btn provider-tabs__btn--active" type="button" data-provider="draftkings" role="tab" aria-selected="true">DraftKings</button>
                            <button class="provider-tabs__btn" type="button" data-provider="bet365" role="tab" aria-selected="false">Bet365</button>
                            <button class="provider-tabs__btn" type="button" data-provider="caesars" role="tab" aria-selected="false">Caesars</button>
                            <button class="provider-tabs__btn" type="button" data-provider="betfair" role="tab" aria-selected="false">Betfair</button>
                            <button class="provider-tabs__btn" type="button" data-provider="unibet" role="tab" aria-selected="false">Unibet</button>
                        </div>
                    </div>
                </div>

                <div class="chart-container">
                    <canvas id="oddsTrendChart"></canvas>
                </div>
                <div class="odds-key-points" id="oddsKeyPoints"></div>
            </div>
        </section>

        <!-- 预测视图：隐含概率 + 信心度 + 价值投注 -->
        <section class="predictions-section hidden" id="predictions">
            <div class="container">
                <div class="pred-hero pred-hero--worldcup">
                    <div class="pred-hero__left">
                        <div class="pred-hero__eyebrow">
                            <span class="pred-hero__trophy" aria-hidden="true">🏆</span>
                            AI 预测引擎
                        </div>
                        <h2 class="pred-hero__title">实时赔率分析</h2>
                        <p class="pred-hero__subtitle">数据驱动洞察 · 把握每一场胜负走向</p>
                    </div>
                    <div class="pred-hero__stats" id="predHeroStats">
                        <div class="pred-hero__stat">
                            <span class="pred-hero__stat-value" id="phTotalMatches">--</span>
                            <span class="pred-hero__stat-label">待预测比赛</span>
                        </div>
                        <div class="pred-hero__stat">
                            <span class="pred-hero__stat-value" id="phWithOdds">--</span>
                            <span class="pred-hero__stat-label">有赔率数据</span>
                        </div>
                        <div class="pred-hero__stat">
                            <span class="pred-hero__stat-value" id="phLastUpdate">--</span>
                            <span class="pred-hero__stat-label">数据更新</span>
                        </div>
                    </div>
                    <div class="pred-hero__refresh">
                        <button class="btn-refresh btn-refresh--small" id="btnRefreshPred" aria-label="刷新赔率数据" title="手动刷新赔率数据">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.65 2.35A8 8 0 1 0 16 8h-2a6 6 0 1 1-1.76-4.24L10 0h6v6l-2.35-3.65z" fill="currentColor"/></svg>
                            <span class="btn-refresh__label">刷新赔率</span>
                        </button>
                    </div>
                </div>

                <div class="pred-matches__container" id="predMatchesContainer" aria-live="polite" aria-label="预测比赛列表">
                </div>
            </div>
        </section>

        <!-- 晋级之路视图：淘汰赛对阵图 -->
        <section class="knockout-section hidden" id="knockout">
            <div class="container">
                <div class="knockout-hero">
                    <div class="knockout-hero__left">
                        <div class="knockout-hero__eyebrow">
                            <span class="knockout-hero__trophy" aria-hidden="true">🏆</span>
                            淘汰赛对阵图
                        </div>
                        <h2 class="knockout-hero__title">晋级之路</h2>
                        <p class="knockout-hero__subtitle">从32强到冠军的完整晋级图</p>
                    </div>
                    <div class="knockout-hero__refresh">
                        <button class="btn-refresh btn-refresh--small" id="btnRefreshKnockout" aria-label="刷新对阵图数据" title="手动刷新对阵图数据">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.65 2.35A8 8 0 1 0 16 8h-2a6 6 0 1 1-1.76-4.24L10 0h6v6l-2.35-3.65z" fill="currentColor"/></svg>
                            <span class="btn-refresh__label">刷新对阵</span>
                        </button>
                    </div>
                </div>
                <div class="knockout__container" id="knockoutContainer" aria-live="polite" aria-label="淘汰赛对阵图">
                </div>
            </div>
        </section>


    </main>

    <!-- 赔率详情模态框：开盘/即时赔率对比 + 概率条 + 推荐 -->
    <div class="modal modal--odds" id="oddsModal" role="dialog" aria-modal="true" aria-labelledby="oddsModalTitle">
        <div class="modal__overlay"></div>
        <div class="modal__content">
            <button class="modal__close" id="oddsModalClose" aria-label="关闭">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <line x1="2" y1="2" x2="14" y2="14"/>
                    <line x1="14" y1="2" x2="2" y2="14"/>
                </svg>
            </button>
            <div class="modal__header">
                <div class="modal__title" id="oddsModalTitle">比赛赔率详情</div>
            </div>
            <div class="modal__body" id="oddsModalBody">
                <div class="modal-loading">
                    <div class="pred-spinner"></div>
                    <span>正在加载赔率数据...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 比赛详情模态框：队伍信息 + 比分 + 赔率入口 -->
    <div class="modal" id="matchModal" role="dialog" aria-modal="true" aria-labelledby="matchModalTitle">
        <div class="modal__overlay"></div>
        <div class="modal__content">
            <button class="modal__close" id="modalClose" aria-label="关闭">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <line x1="2" y1="2" x2="14" y2="14"/>
                    <line x1="14" y1="2" x2="2" y2="14"/>
                </svg>
            </button>
            <h2 id="matchModalTitle" class="sr-only">比赛详情</h2>
            <div id="matchDetails"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 FIFA World Cup Tracker | 实时数据：ESPN</p>
        </div>
    </footer>

    <!-- 头部实时时钟脚本：RAF 驱动，仅秒数变化时更新 DOM -->
    <script>
        (function() {
            const clockDate = document.getElementById('clockDate');
            const clockTime = document.getElementById('clockTime');
            if (!clockDate || !clockTime) return;
            let lastTimeStr = '';
            function updateClock() {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('zh-CN', {
                    hour12: false, timeZone: 'Asia/Shanghai'
                });
                if (timeStr !== lastTimeStr) {
                    lastTimeStr = timeStr;
                    clockTime.textContent = timeStr;
                    clockDate.textContent = now.toLocaleDateString('zh-CN', {
                        year: 'numeric', month: 'long', day: 'numeric', weekday: 'long',
                        timeZone: 'Asia/Shanghai'
                    });
                }
            }
            // 使用 setInterval(1000ms) 替代 requestAnimationFrame 递归：
            // 时钟只需秒级精度，rAF 会以 60fps 持续运行浪费 CPU/电量
            updateClock();
            setInterval(updateClock, 1000);
        })();
    </script>
    <!-- 脚本加载顺序: config(配置) → data(数据) → utils(工具) → apiClient(API) → scheduleView(赛程) → oddsEngine(赔率引擎) → predictionsView(预测) → main(主逻辑) → liveScores(实时比分) -->
    <script src="js/config.js?v=80" defer></script>
    <script src="js/data.js?v=80" defer></script>
    <script src="js/utils.js?v=80" defer></script>
    <script src="js/apiClient.js?v=80" defer></script>
    <script src="js/scheduleView.js?v=80" defer></script>
    <script src="js/oddsEngine.js?v=80" defer></script>
    <script src="js/predictionsView.js?v=80" defer></script>
    <script src="js/knockoutView.js?v=80" defer></script>
    <script src="js/main.js?v=80" defer></script>
    <script src="js/liveScores.js?v=80" defer></script>

</body>
</html>
